experiment:
  name: ppo_nesylink_pixels
  seed: 0
  device: auto
  output_dir: rl/outputs/ppo_nesylink_pixels
  resume: false

environment:
  id: nesylink
  map_path: nesylink/map_data/dungeons/kill_monsters/room_001.json
  reward_id: custom_reward
  action_repeat: 5
  max_episode_steps: 500
  render: false
  observation_mode: pixels

algorithm:
  name: ppo
  total_timesteps: 500000
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 256

evaluation:
  enabled: true
  episodes: 5
  deterministic: true
  save_model: true
  save_metrics: true
  render: false
